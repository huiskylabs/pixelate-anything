<title>@TITLE@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="@DESCRIPTION@">
<style>
  /* Layout: one fixed full-bleed stage; the canvas is scaled by whole device pixels and centered. */
  :root {
    --night: #06080f;      /* letterbox and page ground */
    --glass: #0b1220d9;    /* play button fill */
    --edge: #1d2a3d;       /* play button rim */
    --ember: #f2b45a;      /* play glyph */
    --ember-hi: #ffe2a0;   /* play glyph highlight */
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ember-hi);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }
  #stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--night);
  }
  #stage.idle, #stage.idle * { cursor: none; }
  #frame { position: relative; }
  #c {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #play {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    appearance: none; border: 0; padding: 0; margin: 0;
    background: none;
    cursor: pointer;
    opacity: 1;
    transition: opacity .9s ease, transform .9s ease;
  }
  #play svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  #play .frame { fill: var(--glass); }
  #play .rim { fill: var(--edge); }
  #play .glyph { fill: var(--ember); transition: fill .3s ease; }
  #play .glint { fill: var(--ember-hi); }
  #play:hover .glyph, #play:focus-visible .glyph { fill: var(--ember-hi); }
  #play:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
  #play.busy .glyph { animation: breathe 1.4s steps(4) infinite; }
  #play.gone { opacity: 0; pointer-events: none; transform: translate(-50%, -60%); }
  @keyframes breathe { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    #play, #play.gone { transition: none; transform: translate(-50%, -50%); }
    #play.busy .glyph { animation: none; opacity: .6; }
  }
</style>
<div id="stage">
 <div id="frame">
  <canvas id="c" role="img" aria-label="@ALT@"></canvas>
  <button id="play" type="button" aria-label="Play the soundtrack">
    <svg viewBox="0 0 17 17" aria-hidden="true">
      <path class="rim" d="M2 0H15V1H16V2H17V15H16V16H15V17H2V16H1V15H0V2H1V1H2Z"/>
      <path class="frame" d="M2 1H15V2H16V15H15V16H2V15H1V2H2Z"/>
      <path class="glyph" d="M6 4H7V5H8V6H9V7H10V8H11V9H10V10H9V11H8V12H7V13H6Z"/>
      <path class="glint" d="M6 4H7V5H6Z M6 5H7V6H6Z"/>
    </svg>
  </button>
 </div>
</div>
<script>

</script>
